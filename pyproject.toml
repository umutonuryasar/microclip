[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "microclip"
version = "0.1.0"
description = "CLIP-style VLM from scratch on a single-GPU budget"
requires-python = ">=3.10"
# Runtime deps live here so `pip install -e .` is self-sufficient — a bare
# clone on Colab has torch/torchvision but NOT wandb/tokenizers, which the
# training path imports. Bounds mirror requirements.txt; `>=` avoids forcing
# a reinstall of Colab's preinstalled torch.
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "tokenizers>=0.15",
    "pyyaml",
    "wandb",
    "tqdm",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
